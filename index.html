<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Hit Feel — 终版对标 Demo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; }
  html, body { margin:0; height:100%; background:#07080c; color:#e8ecf4;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
  #wrap { position:relative; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  canvas { display:block; width:100%; max-width:960px; max-height:58vh; background:#090a0f;
    border-radius:10px; box-shadow:0 0 0 1px #1e2430, 0 18px 40px rgba(0,0,0,.5); }
  #topbar { width:min(960px,100%); padding:8px 10px 4px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; justify-content:space-between; }
  #topbar .modes, #topbar .opts { display:flex; flex-wrap:wrap; gap:6px; }
  button.tb {
    font-size:12px; padding:7px 11px; border-radius:999px; border:1px solid #3b4a63;
    background:rgba(18,24,38,.9); color:#e8ecf4;
  }
  button.tb.on { border-color:#fd6738; color:#ffb39a; }
  button.tb.cyan.on { border-color:#33bbfe; color:#9ad9ff; }
  #hud { position:absolute; top:52px; left:50%; transform:translateX(-50%); width:min(960px,100%);
    padding:0 12px; display:none; justify-content:space-between; gap:8px; pointer-events:none; z-index:2; }
  #hud.show { display:flex; }
  .barbox { flex:1; max-width:42%; }
  .barbox .name { font-size:11px; opacity:.8; margin-bottom:2px; }
  .bar { height:12px; border-radius:6px; background:#141820; border:1px solid #2a3344; overflow:hidden; }
  .bar>i { display:block; height:100%; background:linear-gradient(90deg,#33bbfe,#7dd3fc); }
  .barbox.right .name { text-align:right; }
  .barbox.right .bar>i { float:right; background:linear-gradient(90deg,#fd6738,#fb923c); }
  #label {
    position:absolute; top:14%; left:50%; transform:translateX(-50%); z-index:3; pointer-events:none;
    font-size:15px; font-weight:700; letter-spacing:.06em; text-shadow:0 2px 10px #000; opacity:.95;
  }
  #controls { width:min(960px,100%); padding:8px 12px calc(10px + env(safe-area-inset-bottom));
    display:none; grid-template-columns:1fr 1fr; gap:10px; align-items:end; }
  #controls.show { display:grid; }
  .pad { display:flex; gap:10px; align-items:center; }
  .pad.right { justify-content:flex-end; flex-wrap:wrap; }
  .btn {
    width:64px; height:64px; border-radius:50%; border:2px solid #3b4a63; background:#141820; color:#e8ecf4;
    font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .btn.rect { width:72px; border-radius:14px; }
  .btn:active, .btn.held { background:#2563eb; border-color:#60a5fa; }
  .btn.atk { background:#3b1d14; border-color:#fd6738; }
  .btn.atk:active, .btn.atk.held { background:#c2410c; }
  .btn.heavy { background:#1a2a33; border-color:#33bbfe; }
  .btn.heavy:active, .btn.heavy.held { background:#0369a1; }
  .hint { width:min(960px,100%); padding:0 12px 4px; font-size:11px; opacity:.65; text-align:center; }
  @media (min-width:700px){ .btn{width:72px;height:72px;} .btn.rect{width:84px;} }
</style>
</head>
<body>
<div id="wrap">
  <div id="topbar">
    <div class="modes">
      <button class="tb on" id="modeShow" type="button">展示·终版一拳</button>
      <button class="tb" id="modeFight" type="button">对战</button>
    </div>
    <div class="opts">
      <button class="tb cyan on" id="verFull" type="button">完整终版</button>
      <button class="tb" id="verBare" type="button">无反馈</button>
      <button class="tb on" id="fxBtn" type="button">特效 ON</button>
      <button class="tb on" id="sfxBtn" type="button">音效 ON</button>
    </div>
  </div>
  <div id="hud">
    <div class="barbox"><div class="name">YOU · 橙</div><div class="bar"><i id="hpYou"></i></div></div>
    <div class="barbox right"><div class="name">AI · 青</div><div class="bar"><i id="hpAi"></i></div></div>
  </div>
  <div id="label">终版 · 好动作 + 适度特效（×0.65）</div>
  <canvas id="c" width="960" height="540"></canvas>
  <div class="hint" id="hintShow">展示模式：自动循环原文终版那一拳 · 可切「无反馈」对照 · F 开关特效</div>
  <div class="hint" id="hintFight" style="display:none">A/D 移动 · J 轻拳 · K 重拳 · W/空格 跳/闪 · S/L 格挡 · F 特效</div>
  <div id="controls">
    <div class="pad left">
      <button class="btn rect" data-k="left">◀ 左</button>
      <button class="btn rect" data-k="right">右 ▶</button>
    </div>
    <div class="pad right">
      <button class="btn" data-k="jump">跳/闪</button>
      <button class="btn atk" data-k="light">轻拳</button>
      <button class="btn heavy" data-k="heavy">重拳</button>
    </div>
  </div>
</div>
<script>
(() => {
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const W = 960, H = 540;
const GROUND = 400;
const FPS = 60;

// —— Palette from ref frames ——
const COL = {
  bg: "#090a0f",
  grid: "rgba(80,90,110,0.18)",
  floor: "rgba(200,210,220,0.55)",
  orange: "#fd6738",
  orangeDark: "#d44e28",
  cyan: "#33bbfe",
  cyanDark: "#1a8fd0",
  eye: "#0a0c10",
  fx: "#ffffff",
  fxWarm: "#ffe08a",
  fxCore: "#ffcc55",
};

let mode = "show"; // show | fight
let variant = "full"; // full | bare
let fxOn = true;
let sfxOn = true;

// Fixed 60fps frame timeline for showcase punch (终版)
const SHOW = {
  idleEnd: 20,
  windupEnd: 32,   // 12f windup
  strikeEnd: 35,   // 3f strike
  hitstopEnd: 46,  // 11f hitstop
  knockEnd: 70,
  recoverEnd: 100,
  loopEnd: 130,
  hitstopRate: 0.25,
  fxLifeScale: 0.65,
};

const AT_L = {
  windup: 8, active: 3, recover: 14,
  dmg: 8, kb: 280, hitstop: 8, reach: 70,
  shake: 5, zoom: 1.03, fxScale: 0.75
};
const ATK_H = {
  windup: 12, active: 3, recover: 22,
  dmg: 16, kb: 480, hitstop: 11, reach: 78,
  shake: 9, zoom: 1.06, fxScale: 1
};

// —— Entities ——
function makeChar(x, color, colorDark, facing) {
  return {
    x, y: GROUND, vx: 0, vy: 0, facing,
    color, colorDark,
    // proportions (ref ~40x45 body in 240 half → scale ~2.2 for 960)
    bodyW: 92, bodyH: 88, headR: 24, handR: 18,
    tilt: 0, // radians
    squashX: 1, squashY: 1,
    flash: 0,
    // hands local offsets (facing-relative)
    handFront: { x: 28, y: -48 }, // punching hand
    handBack: { x: -22, y: -42 },
    punchExtend: 0, // 0..1
    state: "idle",
    frame: 0,
    hitstop: 0,
    invuln: 0,
    hp: 100, maxHp: 100,
    blocking: false,
    onGround: true,
    attack: null,
    hitDone: false,
  };
}

let atk, vic; // showcase
let you, ai;  // fight
let fx = [];
let dust = [];
let cam = { x: 0, y: 0, shake: 0, zoom: 1, targetZoom: 1, push: 0 };
let showFrame = 0;
let showHitFired = false;
let roundOver = false;
let paused = false;

function resetShow() {
  atk = makeChar(380, COL.orange, COL.orangeDark, 1);
  vic = makeChar(560, COL.cyan, COL.cyanDark, -1);
  fx = []; dust = [];
  cam = { x: 0, y: 0, shake: 0, zoom: 1, targetZoom: 1, push: 0 };
  showFrame = 0; showHitFired = false;
}
function resetFight() {
  you = makeChar(320, COL.orange, COL.orangeDark, 1);
  ai = makeChar(640, COL.cyan, COL.cyanDark, -1);
  fx = []; dust = [];
  cam = { x: 0, y: 0, shake: 0, zoom: 1, targetZoom: 1, push: 0 };
  roundOver = false;
  updateHp();
}

// —— FX: rings, square particles, radial shards (原文风格) ——
function spawnHitFX(x, y, scale, lifeFrames) {
  if (!fxOn || variant === "bare") return;
  const life = Math.max(4, Math.round(lifeFrames * SHOW.fxLifeScale));
  // core flash
  fx.push({ t: "core", x, y, life, max: life, r: 18 * scale });
  // rings
  fx.push({ t: "ring", x, y, life, max: life, maxR: 70 * scale, w: 3.5 });
  fx.push({ t: "ring", x, y, life: Math.round(life * 0.85), max: Math.round(life * 0.85), maxR: 42 * scale, w: 2.2 });
  // square particles
  const n = Math.round(10 * scale);
  for (let i = 0; i < n; i++) {
    const a = -Math.PI * 0.15 + Math.random() * Math.PI * 1.3 + (Math.random() < 0.5 ? 0 : Math.PI);
    const sp = (180 + Math.random() * 280) * scale;
    fx.push({
      t: "sq", x, y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
      life: life, max: life,
      s: 5 + Math.random() * 7 * scale,
      rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4,
      warm: Math.random() < 0.35
    });
  }
  // radial shards / star lines
  const rays = Math.round(7 * scale);
  for (let i = 0; i < rays; i++) {
    const a = (i / rays) * Math.PI * 2 + Math.random() * 0.2;
    fx.push({
      t: "ray", x, y, a,
      life: Math.round(life * 0.7), max: Math.round(life * 0.7),
      len: (28 + Math.random() * 36) * scale
    });
  }
}
function spawnDust(x) {
  if (!fxOn || variant === "bare") return;
  for (let i = 0; i < 3; i++) {
    dust.push({
      x: x + (Math.random() - 0.5) * 20,
      y: GROUND - 4,
      vx: (Math.random() - 0.5) * 40,
      life: 18 + Math.random() * 10,
      max: 28,
      s: 3 + Math.random() * 4
    });
  }
}

// —— Audio ——
let ac = null;
function ensureAudio() {
  if (!ac) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) ac = new AC(); }
  if (ac && ac.state === "suspended") ac.resume();
}
function sfxHit(heavy) {
  if (!sfxOn || !ac || variant === "bare") return;
  const t0 = ac.currentTime;
  const o = ac.createOscillator(); const g = ac.createGain();
  o.type = "square";
  o.frequency.setValueAtTime(heavy ? 88 : 130, t0);
  o.frequency.exponentialRampToValueAtTime(heavy ? 36 : 60, t0 + 0.07);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(heavy ? 0.2 : 0.11, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + (heavy ? 0.14 : 0.08));
  o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + 0.16);
  const n = ac.createBufferSource();
  const buf = ac.createBuffer(1, ac.sampleRate * 0.04, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const ng = ac.createGain(); ng.gain.value = heavy ? 0.14 : 0.07;
  n.buffer = buf; n.connect(ng); ng.connect(ac.destination); n.start(t0);
}

// —— Input ——
const keys = { left:0, right:0, jump:0, light:0, heavy:0, block:0 };
const just = { light:0, heavy:0, jump:0 };
const map = { a:"left", ArrowLeft:"left", d:"right", ArrowRight:"right",
  w:"jump", " ":"jump", ArrowUp:"jump", j:"light", k:"heavy", s:"block", l:"block", ArrowDown:"block" };
window.addEventListener("keydown", e => {
  ensureAudio();
  if (e.key === "f" || e.key === "F") { toggleFx(); return; }
  const k = map[e.key]; if (!k) return; e.preventDefault();
  if ((k==="light"||k==="heavy"||k==="jump") && !keys[k]) just[k]=1;
  keys[k]=1;
});
window.addEventListener("keyup", e => { const k=map[e.key]; if(k) keys[k]=0; });
document.querySelectorAll("#controls .btn").forEach(el => {
  const k = el.dataset.k;
  const down = ev => { ev.preventDefault(); ensureAudio(); el.classList.add("held");
    if ((k==="light"||k==="heavy"||k==="jump") && !keys[k]) just[k]=1; keys[k]=1; };
  const up = ev => { ev.preventDefault(); el.classList.remove("held"); keys[k]=0; };
  el.addEventListener("pointerdown", down); el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up); el.addEventListener("pointerleave", up);
});

function toggleFx() {
  fxOn = !fxOn;
  document.getElementById("fxBtn").textContent = fxOn ? "特效 ON" : "特效 OFF";
  document.getElementById("fxBtn").className = "tb" + (fxOn ? " on" : "");
  if (!fxOn) { fx.length = 0; dust.length = 0; }
}
document.getElementById("sfxBtn").onclick = () => {
  sfxOn = !sfxOn; ensureAudio();
  sfxBtn.textContent = sfxOn ? "音效 ON" : "音效 OFF";
  sfxBtn.className = "tb" + (sfxOn ? " on" : "");
};
document.getElementById("modeShow").onclick = () => setMode("show");
document.getElementById("modeFight").onclick = () => setMode("fight");
document.getElementById("verFull").onclick = () => setVariant("full");
document.getElementById("verBare").onclick = () => setVariant("bare");

function setMode(m) {
  mode = m;
  document.getElementById("modeShow").className = "tb" + (m==="show"?" on":"");
  document.getElementById("modeFight").className = "tb" + (m==="fight"?" on":"");
  document.getElementById("hud").classList.toggle("show", m==="fight");
  document.getElementById("controls").classList.toggle("show", m==="fight");
  document.getElementById("hintShow").style.display = m==="show" ? "" : "none";
  document.getElementById("hintFight").style.display = m==="fight" ? "" : "none";
  document.getElementById("verFull").style.display = m==="show" ? "" : "none";
  document.getElementById("verBare").style.display = m==="show" ? "" : "none";
  if (m==="show") resetShow(); else resetFight();
  updateLabel();
}
function setVariant(v) {
  variant = v;
  document.getElementById("verFull").className = "tb cyan" + (v==="full"?" on":"");
  document.getElementById("verBare").className = "tb" + (v==="bare"?" on":"");
  resetShow();
  updateLabel();
}
function updateLabel() {
  const el = document.getElementById("label");
  if (mode === "fight") el.textContent = "对战";
  else el.textContent = variant === "full"
    ? "终版 · 好动作 + 适度特效（×0.65）"
    : "对照 · 无反馈（同动作，关卡帧/特效/镜头）";
}
function updateHp() {
  if (!you) return;
  document.getElementById("hpYou").style.width = Math.max(0, you.hp/you.maxHp*100) + "%";
  document.getElementById("hpAi").style.width = Math.max(0, ai.hp/ai.maxHp*100) + "%";
}

// —— Pose helpers ——
function setPoseIdle(c) {
  c.tilt = 0; c.squashX = 1; c.squashY = 1; c.punchExtend = 0;
  c.handFront = { x: 42, y: -44 }; c.handBack = { x: -38, y: -40 };
}
function setPoseWindup(c, p) { // p 0..1 — lean BACK (canvas +rot = forward when facing right)
  c.tilt = -0.72 * p;
  c.squashX = 1 + 0.18 * p; c.squashY = 1 - 0.22 * p;
  c.punchExtend = -0.45 * p;
  c.handFront = { x: 6 - 42 * p, y: -48 - 4 * p };
  c.handBack = { x: -22 + 10 * p, y: -34 };
}
function setPoseStrike(c, p) { // p 0..1 through strike
  c.tilt = 0.48;
  c.squashX = 1.22; c.squashY = 0.84;
  c.punchExtend = 0.15 + 1.0 * p;
  c.handFront = { x: 40 + 78 * p, y: -48 };
  c.handBack = { x: -34, y: -34 };
  c.x += c.facing * 3.2; // lunge
}
function setPoseHitAttacker(c) {
  c.tilt = 0.42;
  c.squashX = 1.15; c.squashY = 0.88;
  c.punchExtend = 1;
  c.handFront = { x: 108, y: -48 };
  c.handBack = { x: -30, y: -34 };
}
function setPoseHurt(c, p) { // p 0 at hit ..1 later
  c.tilt = -0.62; // lean back in local space
  c.squashX = 0.68 + 0.32 * Math.min(1, p * 2);
  c.squashY = 1.28 - 0.28 * Math.min(1, p * 2);
  c.handFront = { x: 26, y: -42 }; c.handBack = { x: -26, y: -42 };
  c.punchExtend = 0;
}

// —— Showcase update (frame counted) ——
function updateShow() {
  showFrame++;
  if (showFrame > SHOW.loopEnd) {
    resetShow();
    return;
  }
  const f = showFrame;
  const full = variant === "full";

  // camera ease toward mid
  const mid = (atk.x + vic.x) / 2;
  cam.x += (mid - W / 2 - cam.x) * 0.08;

  if (f <= SHOW.idleEnd) {
    setPoseIdle(atk); setPoseIdle(vic);
    document.getElementById("label").textContent = full
      ? "终版 · 好动作 + 适度特效（×0.65）" : "对照 · 无反馈";
  } else if (f <= SHOW.windupEnd) {
    const p = (f - SHOW.idleEnd) / (SHOW.windupEnd - SHOW.idleEnd);
    setPoseWindup(atk, p); setPoseIdle(vic);
    if (full) { cam.targetZoom = 1.02; cam.push = -6; }
  } else if (f <= SHOW.strikeEnd) {
    const p = (f - SHOW.windupEnd) / (SHOW.strikeEnd - SHOW.windupEnd);
    setPoseStrike(atk, p); setPoseIdle(vic);
  } else if (f <= SHOW.hitstopEnd) {
    // HIT frame
    if (!showHitFired) {
      showHitFired = true;
      const hx = atk.x + atk.facing * (atk.handFront.x);
      const hy = atk.y + atk.handFront.y;
      if (full) {
        spawnHitFX(hx, hy, 1, SHOW.hitstopEnd - SHOW.strikeEnd);
        cam.shake = 9;
        cam.targetZoom = 1.07;
        cam.push = 14;
        vic.flash = 5;
        sfxHit(true);
      }
      // impact pose
      setPoseHitAttacker(atk);
      setPoseHurt(vic, 0);
      if (full) vic.vx = 9.5; // px per frame-ish during knock
      else vic.vx = 6;
    }
    const hsP = (f - SHOW.strikeEnd) / (SHOW.hitstopEnd - SHOW.strikeEnd);
    if (full) {
      // low-speed continue
      atk.handFront.x += 0.35;
      vic.tilt = -0.5 - 0.05 * hsP;
      vic.squashX = 0.7 + 0.05 * hsP;
      // move at 0.25
      vic.x += vic.vx * SHOW.hitstopRate;
      atk.x += 0.15;
    } else {
      // bare: no freeze, keep moving
      vic.x += vic.vx;
      setPoseHurt(vic, hsP);
    }
    setPoseHitAttacker(atk);
  } else if (f <= SHOW.knockEnd) {
    const p = (f - SHOW.hitstopEnd) / (SHOW.knockEnd - SHOW.hitstopEnd);
    // recover punch
    atk.punchExtend = 1 - p;
    atk.handFront = { x: 100 - 70 * p, y: -50 + 4 * p };
    atk.tilt = 0.42 * (1 - p);
    atk.squashX += (1 - atk.squashX) * 0.15;
    atk.squashY += (1 - atk.squashY) * 0.15;
    vic.x += vic.vx;
    vic.vx *= 0.92;
    setPoseHurt(vic, 0.3 + p * 0.7);
    if (full && f % 3 === 0 && Math.abs(vic.vx) > 1.5) spawnDust(vic.x);
    if (full) { cam.targetZoom += (1 - cam.targetZoom) * 0.08; cam.shake *= 0.85; }
  } else {
    const p = Math.min(1, (f - SHOW.knockEnd) / (SHOW.recoverEnd - SHOW.knockEnd));
    setPoseIdle(atk);
    atk.tilt *= 1 - p; atk.squashX += (1-atk.squashX)*0.2; atk.squashY += (1-atk.squashY)*0.2;
    vic.vx *= 0.85;
    vic.tilt *= 1 - p;
    vic.squashX += (1-vic.squashX)*0.15;
    vic.squashY += (1-vic.squashY)*0.15;
    if (p > 0.95) { setPoseIdle(vic); vic.tilt = 0; }
    cam.targetZoom += (1 - cam.targetZoom) * 0.1;
    cam.push *= 0.9;
  }

  // flash countdown
  if (vic.flash > 0) vic.flash--;
  tickFX(full);
  tickCam();
}

function tickFX(full) {
  // FX always tick at full frame rate (even during hitstop) — 原文：特效照常
  for (let i = fx.length - 1; i >= 0; i--) {
    const p = fx[i];
    p.life--;
    if (p.t === "sq") {
      p.x += p.vx / FPS * 60 * 0.55;
      p.y += p.vy / FPS * 60 * 0.55;
      p.vy += 12;
      p.rot += p.vr;
    }
    if (p.life <= 0) fx.splice(i, 1);
  }
  for (let i = dust.length - 1; i >= 0; i--) {
    const d = dust[i];
    d.life--; d.x += d.vx / 60;
    if (d.life <= 0) dust.splice(i, 1);
  }
}
function tickCam() {
  cam.shake = Math.max(0, cam.shake - 0.55);
  cam.zoom += (cam.targetZoom - cam.zoom) * 0.15;
  cam.targetZoom += (1 - cam.targetZoom) * 0.04;
  cam.push *= 0.9;
}

// —— Fight mode (frame-based attacks) ——
const keysAI = { left:0, right:0, block:0 };
let aiThink = 0;

function startAtk(f, heavy) {
  if (f.hitstop > 0 || f.state === "attack" || f.state === "hurt" || roundOver) return;
  if (!f.onGround && heavy) return;
  f.state = "attack";
  f.frame = 0;
  f.attack = heavy ? ATK_H : ATK_L;
  f.hitDone = false;
  f.blocking = false;
}
function bodyBox(f) {
  return { x: f.x - f.bodyW * 0.45, y: f.y - f.bodyH - f.headR * 0.5, w: f.bodyW * 0.9, h: f.bodyH + f.headR * 0.6 };
}
function fistPos(f) {
  const localX = (f.handFront.x + f.punchExtend * 0) ; // handFront already includes extend in fight
  return { x: f.x + localX * f.facing, y: f.y + f.handFront.y };
}

function updateFightChar(f, input, foe) {
  // face
  f.facing = f.x < foe.x ? 1 : -1;

  if (f.hitstop > 0) {
    f.hitstop--;
    // 0.25 continue
    if (f.state === "attack") {
      f.handFront.x += 0.4;
      f.frame += SHOW.hitstopRate;
    } else if (f.state === "hurt") {
      f.x += f.vx * SHOW.hitstopRate;
      f.frame += SHOW.hitstopRate;
    }
    if (f.flash > 0) f.flash--;
    return;
  }

  if (f.state === "attack") {
    f.frame++;
    const a = f.attack;
    if (f.frame <= a.windup) {
      setPoseWindup(f, f.frame / a.windup);
    } else if (f.frame <= a.windup + a.active) {
      const p = (f.frame - a.windup) / a.active;
      setPoseStrike(f, p);
      if (!f.hitDone) {
        const fist = { x: f.x + f.handFront.x * f.facing, y: f.y + f.handFront.y, r: f.handR + 4 };
        const bb = bodyBox(foe);
        if (fist.x > bb.x && fist.x < bb.x + bb.w && fist.y > bb.y && fist.y < bb.y + bb.h) {
          applyFightHit(f, foe, a);
          f.hitDone = true;
        }
      }
    } else if (f.frame <= a.windup + a.active + a.recover) {
      const p = (f.frame - a.windup - a.active) / a.recover;
      f.punchExtend = 1 - p;
      f.handFront = { x: 100 - 70 * p, y: -50 };
      f.tilt *= 0.85;
      f.squashX += (1 - f.squashX) * 0.2;
      f.squashY += (1 - f.squashY) * 0.2;
    } else {
      f.state = "idle"; f.attack = null; setPoseIdle(f);
    }
    if (f.flash > 0) f.flash--;
    return;
  }

  if (f.state === "hurt") {
    f.frame++;
    f.x += f.vx; f.vx *= 0.9;
    setPoseHurt(f, Math.min(1, f.frame / 20));
    if (f.frame % 3 === 0 && Math.abs(f.vx) > 1.2) spawnDust(f.x);
    if (f.frame > 28) { f.state = "idle"; setPoseIdle(f); f.vx = 0; }
    if (f.flash > 0) f.flash--;
    return;
  }

  // move
  if (input.block) {
    f.blocking = true; f.state = "block";
    f.handFront = { x: 36, y: -58 }; f.handBack = { x: 18, y: -50 };
    f.tilt = 0.1 * f.facing;
  } else {
    f.blocking = false;
    let ax = 0;
    if (input.left) ax -= 1;
    if (input.right) ax += 1;
    if (ax) { f.vx = ax * 5.2; f.state = "walk"; }
    else { f.vx *= 0.75; if (Math.abs(f.vx)<0.2){ f.vx=0; f.state="idle"; setPoseIdle(f);} }
    f.x += f.vx;
    if (f.state === "walk") {
      f.handFront = { x: 30, y: -46 + Math.sin(f.frame*0.4)*3 };
      f.handBack = { x: -24, y: -40 - Math.sin(f.frame*0.4)*3 };
      f.frame++;
    }
  }

  if (just.jump && f === you) {
    if (f.onGround) { f.vy = -14; f.onGround = false; }
    else if (f.invuln <= 0) { f.invuln = 14; f.vx = -f.facing * 6; }
    just.jump = 0;
  }
  if (f === you) {
    if (just.light) { startAtk(f, false); just.light = 0; }
    if (just.heavy) { startAtk(f, true); just.heavy = 0; }
  }

  // gravity
  f.vy += 0.55; f.y += f.vy;
  if (f.y >= GROUND) { f.y = GROUND; f.vy = 0; f.onGround = true; }
  else f.onGround = false;
  f.x = Math.max(60, Math.min(W - 60, f.x));
  if (f.invuln > 0) f.invuln--;
  if (f.flash > 0) f.flash--;
}

function applyFightHit(attacker, defender, a) {
  if (defender.invuln > 0) return;
  if (defender.blocking && defender.facing === -attacker.facing) {
    defender.hp = Math.max(0, defender.hp - a.dmg * 0.15);
    defender.vx = attacker.facing * 3;
    attacker.hitstop = Math.round(a.hitstop * 0.5);
    defender.hitstop = attacker.hitstop;
    spawnHitFX(attacker.x + attacker.facing * attacker.handFront.x, attacker.y + attacker.handFront.y, 0.5 * a.fxScale, a.hitstop);
    cam.shake = a.shake * 0.4;
    sfxHit(false);
    updateHp();
    return;
  }
  defender.hp = Math.max(0, defender.hp - a.dmg);
  defender.state = "hurt"; defender.frame = 0; defender.attack = null;
  defender.vx = attacker.facing * (a.kb / 50);
  defender.flash = 5;
  defender.squashX = 0.7; defender.squashY = 1.25;
  setPoseHurt(defender, 0);
  attacker.hitstop = a.hitstop;
  defender.hitstop = a.hitstop;
  const hx = attacker.x + attacker.facing * 72;
  const hy = GROUND - 56;
  spawnHitFX(hx, hy, a.fxScale, a.hitstop);
  cam.shake = a.shake; cam.targetZoom = a.zoom; cam.push = attacker.facing * 12;
  sfxHit(a.dmg > 10);
  spawnDust(defender.x);
  updateHp();
  if (defender.hp <= 0) roundOver = true;
}

function updateAI() {
  aiThink--;
  const dist = Math.abs(ai.x - you.x);
  keysAI.left = keysAI.right = keysAI.block = 0;
  if (aiThink <= 0) {
    aiThink = 12 + Math.floor(Math.random() * 18);
    if (you.state === "attack" && dist < 120 && Math.random() < 0.5) ai._intent = "block";
    else if (dist > 140) ai._intent = "approach";
    else if (dist < 70 && Math.random() < 0.3) ai._intent = "retreat";
    else if (Math.random() < 0.55) ai._intent = Math.random() < 0.65 ? "light" : "heavy";
    else ai._intent = "idle";
  }
  if (ai._intent === "approach") { if (ai.x > you.x) keysAI.left=1; else keysAI.right=1; }
  else if (ai._intent === "retreat") { if (ai.x > you.x) keysAI.right=1; else keysAI.left=1; }
  else if (ai._intent === "block") keysAI.block = 1;
  else if (ai._intent === "light") { startAtk(ai, false); ai._intent = "idle"; }
  else if (ai._intent === "heavy") { startAtk(ai, true); ai._intent = "idle"; }
}

function updateFight() {
  if (!roundOver) {
    updateAI();
    updateFightChar(you, keys, ai);
    updateFightChar(ai, keysAI, you);
    // separate
    if (Math.abs(you.x - ai.x) < 70) {
      const push = (70 - Math.abs(you.x - ai.x)) * 0.5;
      if (you.x < ai.x) { you.x -= push; ai.x += push; }
      else { you.x += push; ai.x -= push; }
    }
  }
  const mid = (you.x + ai.x) / 2;
  cam.x += (mid - W / 2 + cam.push - cam.x) * 0.1;
  tickFX(true); tickCam();
}

// —— Draw ——
function drawBg() {
  ctx.fillStyle = COL.bg;
  ctx.fillRect(-400, -200, W + 800, H + 400);
  ctx.strokeStyle = COL.grid;
  ctx.lineWidth = 1;
  for (let x = -400; x < W + 400; x += 48) {
    ctx.beginPath(); ctx.moveTo(x, -200); ctx.lineTo(x, H + 200); ctx.stroke();
  }
  for (let y = -200; y < H + 200; y += 48) {
    ctx.beginPath(); ctx.moveTo(-400, y); ctx.lineTo(W + 400, y); ctx.stroke();
  }
  // floor line
  ctx.strokeStyle = COL.floor;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-400, GROUND + 0.5);
  ctx.lineTo(W + 400, GROUND + 0.5);
  ctx.stroke();
}

function roundRectPath(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function drawChar(c) {
  const col = c.flash > 0 ? "#ffffff" : c.color;
  const dark = c.flash > 0 ? "#e8e8e8" : c.colorDark;
  if (c.invuln > 0 && (c.invuln % 2 === 0)) ctx.globalAlpha = 0.4;

  // Body + head: facing + tilt + squash (原文圆角方块无腿)
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.scale(c.facing, 1);
  ctx.rotate(c.tilt);
  ctx.scale(c.squashX, c.squashY);
  ctx.fillStyle = col;
  roundRectPath(-c.bodyW / 2, -c.bodyH, c.bodyW, c.bodyH, 26);
  ctx.fill();
  ctx.strokeStyle = dark;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, -c.bodyH - c.headR * 0.35, c.headR, 0, Math.PI * 2);
  ctx.fillStyle = col;
  ctx.fill();
  ctx.fillStyle = COL.eye;
  ctx.beginPath();
  ctx.arc(9, -c.bodyH - c.headR * 0.35, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Hands: facing only, NO body tilt — keep fist at chest height like原文
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.scale(c.facing, 1);
  const hf = c.handFront, hb = c.handBack;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(hb.x, hb.y, c.handR * 0.9, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(hf.x, hf.y, c.handR, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawFX() {
  for (const p of fx) {
    const k = Math.max(0, p.life / p.max);
    if (p.t === "core") {
      ctx.globalAlpha = k * 0.85;
      ctx.fillStyle = COL.fxCore;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.6 + 0.4 * k), 0, Math.PI * 2); ctx.fill();
    } else if (p.t === "ring") {
      const r = (1 - k) * p.maxR;
      ctx.globalAlpha = k * 0.9;
      ctx.strokeStyle = COL.fx;
      ctx.lineWidth = p.w * (0.6 + 0.4 * k);
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(1, r), 0, Math.PI * 2); ctx.stroke();
      // warm outer
      ctx.globalAlpha = k * 0.35;
      ctx.strokeStyle = COL.fxWarm;
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(1, r + 3), 0, Math.PI * 2); ctx.stroke();
    } else if (p.t === "sq") {
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.warm ? COL.fxWarm : COL.fx;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s);
      ctx.restore();
    } else if (p.t === "ray") {
      ctx.globalAlpha = k * 0.95;
      ctx.strokeStyle = COL.fx;
      ctx.lineWidth = 2;
      const len = p.len * (0.5 + 0.5 * k);
      ctx.beginPath();
      ctx.moveTo(p.x + Math.cos(p.a) * 6, p.y + Math.sin(p.a) * 6);
      ctx.lineTo(p.x + Math.cos(p.a) * len, p.y + Math.sin(p.a) * len);
      ctx.stroke();
    }
  }
  for (const d of dust) {
    const k = d.life / d.max;
    ctx.globalAlpha = k * 0.5;
    ctx.fillStyle = "#c8d0dc";
    ctx.fillRect(d.x - d.s / 2, d.y - d.s / 2, d.s, d.s);
  }
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const sx = (Math.random() - 0.5) * cam.shake * 2;
  const sy = (Math.random() - 0.5) * cam.shake * 2;
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-W / 2 - cam.x + sx + cam.push * 0.3, -H / 2 + sy);

  drawBg();
  if (mode === "show") {
    drawChar(atk); drawChar(vic);
  } else {
    drawChar(you); drawChar(ai);
  }
  drawFX();

  // hitstop badge
  if (mode === "show" && variant === "full" && showFrame > SHOW.strikeEnd && showFrame <= SHOW.hitstopEnd) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "rgba(0,0,0,0.65)";
    ctx.fillRect(W - 168, 56, 150, 28);
    ctx.fillStyle = "#ffe08a";
    ctx.font = "bold 13px sans-serif";
    ctx.fillText("卡帧中 HITSTOP", W - 158, 75);
  }
  if (mode === "show" && variant === "bare") {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "rgba(15,20,30,0.55)";
    ctx.fillRect(W / 2 - 120, 50, 240, 26);
    ctx.fillStyle = "#94a3b8";
    ctx.font = "12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("无反馈 · 验证动作因果", W / 2, 67);
    ctx.textAlign = "left";
  }
  ctx.restore();
}

// —— Fixed timestep 60fps ——
let acc = 0, last = performance.now();
const STEP = 1000 / FPS;
function frame(now) {
  acc += now - last; last = now;
  if (acc > 200) acc = 200;
  while (acc >= STEP) {
    if (!paused) {
      if (mode === "show") updateShow();
      else updateFight();
    }
    acc -= STEP;
  }
  draw();
  requestAnimationFrame(frame);
}

// debug for headless
window.__HF = {
  mode: () => mode,
  variant: () => variant,
  showFrame: () => showFrame,
  setMode, setVariant,
  resetShow, resetFight,
  fxCount: () => fx.length,
  pause(v) { paused = !!v; },
  step() { if (mode === "show") updateShow(); else updateFight(); },
  seekShow(f) {
    paused = true;
    resetShow();
    for (let i = 0; i < f; i++) updateShow();
  },
  atHit() { return showFrame > SHOW.strikeEnd && showFrame <= SHOW.hitstopEnd; },
  chars() {
    const a = mode==="show" ? atk : you;
    const b = mode==="show" ? vic : ai;
    return { ax:a.x, ay:a.y, bx:b.x, by:b.y, fx: fx.length, flash:b.flash, tilt:b.tilt };
  }
};

resetShow();
setMode("show");
requestAnimationFrame(frame);
})();
</script>
</body>
